<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ CAFE_NAME }} Wi-Fi</title>
{# No external fonts, images or scripts: customers are not online yet. #}
<style>
  :root { --ink:#0F2A43; --paper:#F6F8FB; --yellow:#FFC531; --red:#B42318; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
         background:var(--ink); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:380px; background:var(--paper); border-radius:14px; padding:28px 24px 24px; }
  h1 { margin:0 0 4px; font-size:1.5rem; line-height:1.2; }
  p { margin:0 0 16px; line-height:1.45; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input[type=text] { width:100%; font:inherit; font-size:1.4rem; letter-spacing:.12em; text-align:center;
         text-transform:uppercase; padding:14px 10px; border:2px solid var(--ink); border-radius:10px; background:#fff; }
  input[type=text]:focus-visible, button:focus-visible { outline:3px solid var(--yellow); outline-offset:2px; }
  button { width:100%; margin-top:14px; font:inherit; font-weight:700; font-size:1.1rem; padding:14px;
           border:0; border-radius:10px; background:var(--yellow); color:var(--ink); cursor:pointer; }
  .error { background:#FDECEA; color:var(--red); border-radius:8px; padding:10px 12px; margin-bottom:14px; font-weight:600; }
  .hint { margin:16px 0 0; font-size:.92rem; color:#4A5D70; }
</style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
